<html lang="he" dir="rtl">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f7" />
    <meta name="description" content="מערכת תפעול מטענים של Overseas Commerce" />
    <meta name="app-base-url" content="/overseas-demo-site/" />
    <link rel="icon" type="image/jpeg" href="/overseas-demo-site/brand/overseas-commerce-logo.jpg" />
    <title>Overseas | מרכז תפעול מטענים</title>
    <script>
      const redirectPath = new URLSearchParams(window.location.search).get('__ghpages_path')
      const appBaseUrl = document.querySelector('meta[name="app-base-url"]').content
      if (redirectPath) {
        const destination = new URL(redirectPath, window.location.origin)
        if (destination.origin === window.location.origin && destination.pathname.startsWith(appBaseUrl)) {
          window.history.replaceState(null, '', `${destination.pathname}${destination.search}${destination.hash}`)
        }
      }
    </script>
    <script type="module" crossorigin src="/overseas-demo-site/assets/index-Cw7sM7QQ.js"></script>
  </head>

  </body>
